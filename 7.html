<!DOCTYPE html>
<html>
<head>
    <title>Event Admin Table</title>

    <style>
        /* Table Styling */
        table {
            width: 60%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightblue;
        }

        /* Zebra Striping */
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Community Events</h2>

    <table>
        <tr>
            <th>Event ID</th>
            <th>Event Name</th>
            <th>Date</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Clean-Up Drive</td>
            <td>10-07-2026</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Tree Plantation</td>
            <td>15-07-2026</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Health Camp</td>
            <td>20-07-2026</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Sports Meet</td>
            <td>25-07-2026</td>
        </tr>
    </table>

</body>
</html>
