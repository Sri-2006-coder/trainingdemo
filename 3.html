<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selectors Playground</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    h2 {
      font-family: Arial, sans-serif;
      color: #2a2a72;
      text-align: center;
      margin: 1rem 0;
    }

    #mainHeader {
      background: #f4a261;
      padding: 1.5rem;
      text-align: center;
      color: white;
    }

    .eventCard {
      background: #e9c46a;
      border-radius: 10px;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 500px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h3,
    p {
      font-family: Georgia, serif;
      color: #264653;
      line-height: 1.5;
    }

    .eventCard h3 {
      margin-bottom: 0.5rem;
    }

    .eventCard p {
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <header id="mainHeader">
    <h1>Selectors Playground</h1>
  </header>

  <main>
    <h2>Find the Right Selector</h2>

    <section class="eventCard">
      <h3>Community Meetup</h3>
      <p>Date: June 20</p>
      <p>Join us for a welcoming session about web development.</p>
    </section>

    <section class="eventCard">
      <h3>Design Workshop</h3>
      <p>Date: July 5</p>
      <p>Learn how CSS selectors can improve your styling workflow.</p>
    </section>
  </main>
</body>
</html>
